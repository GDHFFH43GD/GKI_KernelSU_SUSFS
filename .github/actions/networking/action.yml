name: 'Setup Networking'
description: 'Set up all networking options (IP Set, TCP CC, Qdisc, BBRv3, CIFS, Wireguard)'
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Networking Configs
      uses: ./.github/actions/networking-config

    - name: Apply BBRv3 Patches
      uses: ./.github/actions/bbrv3
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ inputs.sublevel }}

    - name: Setup CIFS Configs
      uses: ./.github/actions/cifs
      with:
        version: ${{ inputs.version }}

    - name: Apply In-Kernel Tether Optimizer & Wire-Speed VPN Forwarder
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        PATCH_FILE="${{ github.action_path }}/patches/0003-in-kernel-tether-vpn-optimizer.patch"
        if [ -f "$PATCH_FILE" ]; then
          echo "[+] Applying In-Kernel Tether Optimizer & Wire-Speed VPN Forwarder..."
          if patch -p1 --dry-run < "$PATCH_FILE" >/dev/null 2>&1; then
            patch -p1 < "$PATCH_FILE"
            echo "[+] In-Kernel Tether Optimizer & VPN Forwarder applied successfully!"
          else
            echo "[!] Dry-run patch check had warnings, applying with fallback..."
            patch -p1 -N < "$PATCH_FILE" || true
          fi
        fi
